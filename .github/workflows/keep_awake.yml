name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute sleep cycle
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging https://msme-viability-assessment.onrender.com/health..."
          curl -sS https://msme-viability-assessment.onrender.com/health
